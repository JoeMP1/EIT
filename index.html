<!DOCTYPE html>
<html lang="en">
    <head>
        <title>EIT</title>
        <link rel="stylesheet" href="styles.css">
        <link href="https://fonts.googleapis.com/css2?family=Poppins&display=swap" rel="stylesheet">
    </head>
    <body>
        <script src="script.js" defer></script>
        <div class="HomePage">
            <h1>Environment impact</h1>
            <p>Want to track your impact on the environment? Click the button below to start!</p>
            <button class="start">Start</button>
        </div>
        <div class = "Questions-container">
            <div class = "Questions">
                <h2>How do you travel daily?</h2>
            </div>
            <div class = "Options-container">
                <div class = "Options">
                    <label>
                        <input value="Car" type="radio" class="check" onclick="isCheck()" name="answer">
                        <span>Car</span>
                    </label>
                    <label class = "Value">
                        <input type="number" class = "Number-value" min="0" placeholder="Enter a number" value="1">
                        <br>
                        <span>How many Km per day? </span>
                    </label >
                </div>
                <div class = "Options">
                    <label>
                        <input value = "Bus" type="radio" class="check"onclick="isCheck()"  name="answer">
                        <span>Bus</span>
                    </label>
                    <label class = "Value">
                        <input type="number" class = "Number-value" min="0" placeholder="Enter a number"  value="1">
                        <br>
                        <span>How many Km per day? </span>
                    </label >
                </div>
                <div class = "Options">
                    <label>
                        <input value = "Train" type="radio" class="check" onclick="isCheck()" name="answer">
                        <span>Train</span>
                        
                    </label>
                    <label class = "Value">
                        <input type="number" class = "Number-value" min="0" placeholder="Enter a number" value="1">
                        <br>
                        <span>How many Km per day? </span>
                    </label >
                </div>
                <div class = "Options">
                    <label>
                        <input value = "Walk" type="radio" class="check"onclick="isCheck()" name="answer">
                        <span>Walk</span>
                    </label>
                    <label class = "Value">
                        <input type="number" class = "Number-value" min="0" placeholder="Enter a number" value="1">
                        <br>
                        <span>How many Km per day? </span>
                    </label >
                </div>
            </div>
            <div class = "Next">
                <button class = "next">Next</button>
            </div>
            <div class = "Error">
                <p>Choose an options dude</p>
            </div>
        </div>
    </body>
</html>
